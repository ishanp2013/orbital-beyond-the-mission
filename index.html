<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORBITAL — Beyond the Mission</title>
  <meta name="description" content="Design, launch and operate a complete space mission. An educational space-mission simulator built on real physics for the NASA Space Apps Challenge.">
  <meta name="theme-color" content="#02050c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='7' fill='%234fd8ff'/%3E%3Cellipse cx='20' cy='20' rx='17' ry='7.5' fill='none' stroke='%23a184ff' stroke-width='2' transform='rotate(-28 20 20)'/%3E%3Ccircle cx='34' cy='13' r='2.6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="learn-on">
  <canvas id="starfield" aria-hidden="true"></canvas>
  <header id="topbar">
    <div class="brand" role="button" tabindex="0" aria-label="ORBITAL home"></div>
    <nav class="stepper" id="stepper" aria-label="Mission lifecycle"></nav>
    <div class="top-actions">
      <label class="switch" title="Show engineering explanations and formulas"><input type="checkbox" id="learn-toggle" checked><span class="track"></span><span class="lbl">Learning mode</span></label>
      <button class="btn sm ghost" id="lib-btn" title="Tutorials, glossary, assumptions and references">📖 <span class="lbl">Library</span></button>
    </div>
  </header>
  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="tooltip" role="tooltip"></div>
  <noscript><p style="padding:40px;color:#fff">ORBITAL needs JavaScript to run.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/events.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/art.js"></script>
  <script src="js/store.js"></script>
  <script src="js/screens/design.js"></script>
  <script src="js/screens/plan.js"></script>
  <script src="js/screens/intro.js"></script>
  <script src="js/screens/review.js"></script>
  <script src="js/screens/launch.js"></script>
  <script src="js/screens/ops.js"></script>
  <script src="js/screens/report.js"></script>
  <script src="js/screens/library.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
